name: legado_core
description: legado 的纯 Dart 内核：领域模型、书源规则引擎、持久化、应用服务。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

resolution: workspace

# 约束：本包**不允许**依赖 Flutter。
# 一旦出现 flutter/dart:ui，CLI 模式就无法运行，双端共用逻辑的前提就没了。
# 由 test/no_flutter_import_test.dart 强制检查。
dependencies:
  logging: ^1.3.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.15
