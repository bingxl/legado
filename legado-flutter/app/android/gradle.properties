org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# 固定 Gradle 用的 JDK。
# 起因：Android Studio 自带的 JBR 已是 Java 25，而 Gradle 8.14 只要看到 class 文件
# 版本 69 就直接 "Unsupported class file major version 69"，构建连配置阶段都过不去。
# 这里指向本机的 JDK 21（Gradle 8.14 官方支持的最高 LTS）。
# 换机器时要改这一行；不设的话 Flutter 会继续用 JBR，报错信息完全指不到 Java 版本上。
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-21.0.7.6-hotspot

# 关于 CMake：Flutter 3.38 的 Gradle 插件会无条件调用 forceNdkDownload()，
# 把 externalNativeBuild.cmake.path 指到一个空 CMakeLists.txt，只为逼 AGP 装 NDK。
# 于是**每个** Flutter Android 工程都真的需要 CMake，哪怕一行业务 native 代码都没有。
# 本机 SDK 的 cmake/3.22.1 曾是下载中断留下的空壳，已用官方 wheel
# （pip install cmake==3.22.1）补齐，现在走 SDK 标准路径，不需要 cmake.dir。
# 换机器若报 "CMake '3.22.1' was not found"，照上面那条 pip 命令补一次即可。
