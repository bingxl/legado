<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Legado 桌面版应用图标（矢量源文件）
       生成位图：见 build/README-icon.md，或直接 task common:generate:icons -->
  <defs>
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#3D5AF1"/>
      <stop offset="0.52" stop-color="#5B45E0"/>
      <stop offset="1" stop-color="#8B3FD6"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.26" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#F6E9CE"/>
    </linearGradient>
    <linearGradient id="paperEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9D5AF"/>
      <stop offset="1" stop-color="#D8BE90"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6427" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6E4E1D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8A6427" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFCB63"/>
      <stop offset="1" stop-color="#F0972C"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1A1046" flood-opacity="0.34"/>
    </filter>

    <!-- 单页形状：内缘（书脊）高、外缘短，模拟摊开 -->
    <path id="pageLeft"
          d="M508 300 C424 306, 340 318, 284 340 C270 346, 262 356, 262 370
             L262 676 C262 690, 270 700, 284 706 C340 728, 424 742, 508 748 Z"/>
  </defs>

  <!-- 底板 -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#gloss)"/>
  <rect x="41" y="41" width="942" height="942" rx="208" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"/>

  <!-- 书签缎带（压在书页后面，从底部垂出，燕尾剪裁） -->
  <g filter="url(#softShadow)">
    <path d="M484 620 h56 v210 l-28 -34 l-28 34 Z" fill="url(#ribbon)"/>
  </g>

  <!-- 书本：底层书脊厚度 + 上层摊开的双页 -->
  <g filter="url(#softShadow)">
    <!-- 页芯厚度 -->
    <path d="M508 316 C424 322, 340 334, 284 356 C270 362, 262 372, 262 386
             L262 692 C262 706, 270 716, 284 722 C340 744, 424 758, 508 764 Z"
          fill="url(#paperEdge)"/>
    <path d="M516 316 C600 322, 684 334, 740 356 C754 362, 762 372, 762 386
             L762 692 C762 706, 754 716, 740 722 C684 744, 600 758, 516 764 Z"
          fill="url(#paperEdge)"/>

    <!-- 左右两页 -->
    <use href="#pageLeft" fill="url(#paper)"/>
    <path d="M516 300 C600 306, 684 318, 740 340 C754 346, 762 356, 762 370
             L762 676 C762 690, 754 700, 740 706 C684 728, 600 742, 516 748 Z"
          fill="url(#paper)"/>

    <!-- 书脊折痕 -->
    <rect x="504" y="312" width="16" height="420" fill="url(#fold)"/>

    <!-- 正文纹理：暖金色短行 -->
    <g stroke="#E8A63C" stroke-opacity="0.85" stroke-width="20" stroke-linecap="round">
      <path d="M300 408 h150"/>
      <path d="M300 460 h162"/>
      <path d="M300 512 h150"/>
      <path d="M300 564 h96"/>
      <path d="M574 408 h150"/>
      <path d="M574 460 h162"/>
      <path d="M574 512 h150"/>
      <path d="M574 564 h96"/>
    </g>
  </g>
</svg>
