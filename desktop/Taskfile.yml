version: '3'

vars:
  # 与 main.go 里的 Wails 应用名保持一致，产物是 bin/legado-desktop.exe
  APP_NAME: "legado-desktop"
  BIN_DIR: "bin"
  # 前端用 pnpm（仓库里是 pnpm-lock.yaml + node_modules/.pnpm 布局）。
  # 默认走 npm 时 arborist 读 .pnpm 布局会报 "Cannot read properties of null (reading 'edgesOut')"。
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  # 安卓端。APP_ID 与 build/android/app/build.gradle 的 applicationId 保持一致
  # （cn.bingxl.legado，自有包名，不与官方 legado 的 io.legado.app 冲突）。
  #
  # 只覆盖 APP_ID：android/Taskfile.yml 里 SDK_ROOT / ADB / HOST_ARCH 等都用
  # `sh:` 求值，在本机 Git Bash 下能正常展开（ADB 走 `command -v adb`，
  # SDK_ROOT 走 $ANDROID_HOME），在 include 处再给默认值反而会把它们压成空串。
  android:
    taskfile: ./build/android/Taskfile.yml
    vars:
      APP_ID: "cn.bingxl.legado"

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
      # 构建完顺手签名。未配置自签名证书的机器（CI、他人）脚本会自己跳过，
      # 不会让构建失败。配置见 build/windows/setup-dev-cert.ps1。
      - task: sign:dev
        platforms: [windows]

  sign:dev:
    summary: Signs the Windows binary with the local self-signed dev certificate
    desc: |
      用本机自签名证书给 bin/<APP_NAME>.exe 签名，让 SmartScreen 和受控文件夹访问
      认得出这个应用，避免每次重建后又被拦。

      证书指纹来源：-Thumbprint 参数 > 环境变量 LEGADO_CODESIGN_THUMBPRINT >
      %USERPROFILE%\.legado-codesign-thumbprint。

      证书不存在时只打印提示并以 0 退出，不阻塞构建。
    cmds:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/build/windows/sign-dev.ps1" -Exe "{{.BIN_DIR}}/{{.APP_NAME}}.exe"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  dev:mcp:
    summary: Runs the app in dev mode with the Wails MCP server enabled
    desc: |
      给 UI 测试用的开发模式：WAILS_MCP=1 会让 wails3 追加 `mcp` 构建标签，把应用内 MCP
      服务编进二进制，App.Run() 时自动在 http://127.0.0.1:9099/mcp 起 Streamable HTTP 端点。

      端点/端口可用环境变量覆盖：WAILS_MCP_PORT（0 = 随机空闲端口）、WAILS_MCP_HOST、
      WAILS_MCP_TOKEN（仅非 loopback 绑定时必需）、WAILS_MCP_TIMEOUT（JS eval 毫秒）、
      WAILS_MCP_HIDE_CURSOR=1（隐藏动画指针）。探针工具含 dom_query / dom_html /
      screenshot_dom / mouse_* / keyboard_* / js_eval / call_bound_method / wait_for_event。

      mcp 标签只用于开发与测试，`task build` 的生产链路不会带它。
    cmds:
      - cmd: WAILS_MCP=1 wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  ui:mcp:
    summary: Runs the app (production build + MCP) for UI testing
    desc: |
      UI 测试请走这条链路，不要用 dev:mcp——后者是白屏（原因见下）。

      为什么 dev:mcp 会白屏：`wails3 dev` 会设置 FRONTEND_DEVSERVER_URL，让应用把页面
      反向代理到 Vite dev server。但 Wails 的 AssetServer 对 WebSocket 一律返回 501
      （internal/assetserver/common.go 的 isWebSocket 命中后直接 StatusNotImplemented），
      而 Vite 的 HMR 客户端正是靠 WS 与 dev server 通信；握手被 501 后客户端认为连接
      断开并触发整页 reload，重载后 WS 再次失败——页面陷入无限重载。表现是窗口全白，
      且 MCP 探针全部超时：
      "timed out after … waiting for the page to respond; the window may be reloading,
      busy or showing a native dialog"。

      本 task 不设 FRONTEND_DEVSERVER_URL，页面由嵌入的 frontend/dist 提供，
      已验证 UI 完整渲染且 dom_query / js_eval 等探针可用。
      代价：改前端后需要重跑一次本 task（没有热更新）。

      端点与环境变量同 dev:mcp（WAILS_MCP_PORT / HOST / TOKEN / TIMEOUT / HIDE_CURSOR）。
    cmds:
      - cmd: WAILS_MCP=1 wails3 build
      - task: "{{.GOOS}}:run"

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
