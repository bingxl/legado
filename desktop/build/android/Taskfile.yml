version: '3'

includes:
  common: ../Taskfile.yml

vars:
  APP_ID: '{{.APP_ID | default "com.wails.app"}}'
  MIN_SDK: '21'
  TARGET_SDK: '35'
  # 平台差异一律用 go-task 的 OS/ARCH 模板（解析期展开，等价于 GOOS/GOARCH），
  # 不用 `uname`——那是 Git Bash 的外部命令，纯 pwsh/System32 环境下不存在，
  # 会让 sh: 求值静默变空。
  #
  # Gradle wrapper 在 Windows 上的调用方式（go-task 内置 gosh 执行）：
  #   `./gradlew`      → cmd 不认 "./" 前缀，报 "'.' 不是内部或外部命令"，
  #                      且无扩展名的 shell 脚本 cmd 本身就执行不了；
  #   `gradlew.bat`    → 不带分隔符时 gosh 走 exec.LookPath，当前目录又不在
  #                      PATH，报 "executable file not found"；
  #   `./gradlew.bat`  → 同样栽在 "./" 前缀上。
  # 只能显式交给 cmd：`cmd` 本身能被 LookPath 找到，后面的参数原样传给 cmd。
  GRADLEW: '{{if eq OS "windows"}}cmd /c gradlew.bat{{else}}./gradlew{{end}}'
  # The emulator runs the host architecture; physical devices are arm64
  HOST_ARCH: '{{if eq ARCH "arm64"}}arm64{{else}}amd64{{end}}'
  # System-image ABI for the host, used in the "create an AVD" hint below.
  ANDROID_ABI: '{{if eq ARCH "arm64"}}arm64-v8a{{else}}x86_64{{end}}'
  # SDK location: $ANDROID_HOME / $ANDROID_SDK_ROOT, else the per-OS default
  # (Windows: %LOCALAPPDATA%\Android\Sdk, macOS: ~/Library/Android/sdk, Linux: ~/Android/Sdk)
  SDK_ROOT:
    sh: |
      if [ -n "$ANDROID_HOME" ]; then echo "$ANDROID_HOME"
      elif [ -n "$ANDROID_SDK_ROOT" ]; then echo "$ANDROID_SDK_ROOT"
      elif [ "{{OS}}" = "darwin" ]; then echo "$HOME/Library/Android/sdk"
      elif [ "{{OS}}" = "windows" ]; then echo "$LOCALAPPDATA/Android/Sdk"
      else echo "$HOME/Android/Sdk"; fi
  ADB:
    sh: 'command -v adb || echo "{{.SDK_ROOT}}/platform-tools/adb"'
  EMULATOR:
    sh: 'command -v emulator || echo "{{.SDK_ROOT}}/emulator/emulator"'
  # avdmanager lives under cmdline-tools/<version>/bin; used to auto-create an
  # AVD when none exists (mirrors the iOS `ensure-simulator` auto-create flow).
  # 用 glob 循环取字典序最后一个（cmdline-tools 目录名是两位版本号，字典序即
  # 版本序），不用 ls|sort|tail——都是 Git Bash 外部命令。
  AVDMANAGER:
    sh: |
      command -v avdmanager && exit 0
      AVD=""
      for d in "{{.SDK_ROOT}}"/cmdline-tools/*/bin/avdmanager*; do
        [ -f "$d" ] && AVD="$d"
      done
      echo "$AVD"

tasks:
  install:deps:
    summary: Check and install Android development dependencies
    cmds:
      - go run build/android/scripts/deps/install_deps.go
    env:
      TASK_FORCE_YES: '{{if .YES}}true{{else}}false{{end}}'
    prompt: This will check and install Android development dependencies. Continue?

  build:
    summary: Creates a debug build of the application for Android
    deps:
      - task: common:go:mod:tidy
      - task: generate:android:overlay
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
    cmds:
      - echo "Building Android app {{.APP_NAME}}..."
      - task: compile:go:shared
        vars:
          ARCH: '{{.ARCH | default .HOST_ARCH}}'
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production,android -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-tags android,debug -buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  compile:go:shared:
    summary: Compile Go code to shared library (.so)
    cmds:
      - |
        # Locate the NDK: $ANDROID_NDK_HOME, or the newest installed NDK.
        # glob 按字典序展开、循环取最后一个即最新（NDK 版本号均为两位数字段，
        # 字典序与版本序一致）；不用 ls|sort -V|tail——都是 Git Bash 外部命令。
        NDK_ROOT="$ANDROID_NDK_HOME"
        if [ -z "$NDK_ROOT" ]; then
          for d in "{{.SDK_ROOT}}"/ndk/*; do
            [ -d "$d" ] && NDK_ROOT="$d"
          done
        fi
        if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
          echo "Error: Android NDK not found"
          echo "Install one with: sdkmanager 'ndk;26.3.11579264' (or set ANDROID_NDK_HOME)"
          exit 1
        fi

        # Determine toolchain based on host OS.
        # 宿主判定用 go-task 的 OS 模板在解析期展开，不再依赖 uname——
        # 上游模板用 `case "$(uname -s)"`，而 uname 是 Git Bash 外部命令，
        # 纯 pwsh/System32 环境下会静默失败掉进空分支。
        # NDK 的 Windows 预编译目录名是 windows-x86_64。
        {{if eq OS "windows"}}
        HOST_TAG="windows-x86_64"
        # NDK 在 Windows 上给两个包装：无扩展名的是 bash 脚本（要 bash 才能执行），
        # .cmd 是批处理。Go 的 cgo 直接 exec $CC，跑不了 bash 脚本，所以用 .cmd。
        CLANG_EXT=".cmd"
        {{else if eq OS "darwin"}}
        HOST_TAG="darwin-x86_64"
        CLANG_EXT=""
        {{else}}
        HOST_TAG="linux-x86_64"
        CLANG_EXT=""
        {{end}}

        TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/$HOST_TAG"

        # Set compiler based on architecture
        case "{{.ARCH}}" in
          arm64)
            export CC="$TOOLCHAIN/bin/aarch64-linux-android{{.MIN_SDK}}-clang$CLANG_EXT"
            export CXX="$TOOLCHAIN/bin/aarch64-linux-android{{.MIN_SDK}}-clang++$CLANG_EXT"
            export GOARCH=arm64
            JNI_DIR="arm64-v8a"
            ;;
          amd64|x86_64)
            export CC="$TOOLCHAIN/bin/x86_64-linux-android{{.MIN_SDK}}-clang$CLANG_EXT"
            export CXX="$TOOLCHAIN/bin/x86_64-linux-android{{.MIN_SDK}}-clang++$CLANG_EXT"
            export GOARCH=amd64
            JNI_DIR="x86_64"
            ;;
          *)
            echo "Unsupported architecture: {{.ARCH}}"
            exit 1
            ;;
        esac

        export CGO_ENABLED=1
        export GOOS=android

        mkdir -p {{.BIN_DIR}}
        mkdir -p build/android/app/src/main/jniLibs/$JNI_DIR

        go build -buildmode=c-shared -overlay build/android/.overlay/overlay.json {{.BUILD_FLAGS}} \
          -o build/android/app/src/main/jniLibs/$JNI_DIR/libwails.so
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production,android -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-tags android,debug -buildvcs=false -gcflags=all="-l"{{end}}'

  compile:go:all-archs:
    summary: Compile Go code for all Android architectures (fat APK)
    cmds:
      - task: compile:go:shared
        vars:
          ARCH: arm64
      - task: compile:go:shared
        vars:
          ARCH: amd64

  package:
    summary: Packages a production build of the application into a signed release APK
    desc: |
      Builds for arm64 by default (covers 99%+ of real devices). Set ARCH=amd64
      for emulator-only APKs, or use package:fat for a universal APK.
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: '{{.ARCH | default "arm64"}}'
    cmds:
      - task: assemble:apk:release

  package:fat:
    summary: Packages a production build for all architectures (fat APK)
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: arm64
    cmds:
      - task: compile:go:shared
        vars:
          ARCH: amd64
          PRODUCTION: "true"
      - task: assemble:apk:release

  bundle:
    summary: Packages a production AAB (Android App Bundle) for Play Store submission
    desc: |
      Builds for arm64 by default. Set ARCH=amd64 for emulator builds, or use
      bundle:fat for a universal AAB.
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: '{{.ARCH | default "arm64"}}'
    cmds:
      - task: assemble:aab:release

  bundle:fat:
    summary: Packages a production AAB for all architectures
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: arm64
    cmds:
      - task: compile:go:shared
        vars:
          ARCH: amd64
          PRODUCTION: "true"
      - task: assemble:aab:release

  assemble:apk:
    summary: Assembles a debug APK using Gradle
    preconditions:
      - sh: 'command -v java >/dev/null || [ -n "$JAVA_HOME" ]'
        msg: "Java not found. Install a JDK (e.g. brew install openjdk@21) and/or set JAVA_HOME"
    cmds:
      - |
        cd build/android
        # The exec bit is lost when gradlew is extracted from the embedded
        # build assets, so restore it before invoking the wrapper. POSIX only:
        # Windows 没有 exec 位概念，且 gosh 的 chmod 是外部命令（依赖 Git Bash）。
        {{if ne OS "windows"}}chmod +x ./gradlew{{end}}
        {{.GRADLEW}} assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk "../../{{.BIN_DIR}}/{{.APP_NAME}}.apk"
        echo "APK created: {{.BIN_DIR}}/{{.APP_NAME}}.apk"

  assemble:apk:release:
    summary: Assembles a release APK using Gradle (signed with the debug keystore unless ANDROID_KEYSTORE_FILE is set)
    preconditions:
      - sh: 'command -v java >/dev/null || [ -n "$JAVA_HOME" ]'
        msg: "Java not found. Install a JDK (e.g. brew install openjdk@21) and/or set JAVA_HOME"
    cmds:
      - |
        cd build/android
        # The exec bit is lost when gradlew is extracted from the embedded
        # build assets, so restore it before invoking the wrapper. POSIX only:
        # Windows 没有 exec 位概念，且 gosh 的 chmod 是外部命令（依赖 Git Bash）。
        {{if ne OS "windows"}}chmod +x ./gradlew{{end}}
        {{.GRADLEW}} assembleRelease
        cp app/build/outputs/apk/release/app-release.apk "../../{{.BIN_DIR}}/{{.APP_NAME}}.apk"
        echo "Release APK created: {{.BIN_DIR}}/{{.APP_NAME}}.apk"

  assemble:aab:
    summary: Assembles a debug AAB (Android App Bundle) using Gradle
    preconditions:
      - sh: 'command -v java >/dev/null || [ -n "$JAVA_HOME" ]'
        msg: "Java not found. Install a JDK (e.g. brew install openjdk@21) and/or set JAVA_HOME"
    cmds:
      - |
        cd build/android
        # The exec bit is lost when gradlew is extracted from the embedded
        # build assets, so restore it before invoking the wrapper. POSIX only:
        # Windows 没有 exec 位概念，且 gosh 的 chmod 是外部命令（依赖 Git Bash）。
        {{if ne OS "windows"}}chmod +x ./gradlew{{end}}
        {{.GRADLEW}} bundleDebug
        cp app/build/outputs/bundle/debug/app-debug.aab "../../{{.BIN_DIR}}/{{.APP_NAME}}.aab"
        echo "AAB created: {{.BIN_DIR}}/{{.APP_NAME}}.aab"

  assemble:aab:release:
    summary: Assembles a release AAB for Play Store upload (signed with the debug keystore unless ANDROID_KEYSTORE_FILE is set)
    preconditions:
      - sh: 'command -v java >/dev/null || [ -n "$JAVA_HOME" ]'
        msg: "Java not found. Install a JDK (e.g. brew install openjdk@21) and/or set JAVA_HOME"
    cmds:
      - |
        # With Play App Signing, the keystore configured here is your UPLOAD
        # key: Google verifies the upload with it, then re-signs the app with
        # the app signing key it manages for distribution.
        if [ -z "$ANDROID_KEYSTORE_FILE" ]; then
          echo "WARNING: ANDROID_KEYSTORE_FILE is not set, so this AAB will be"
          echo "signed with the debug keystore. Google Play rejects debug-signed"
          echo "bundles. Set ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD,"
          echo "ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD before uploading."
        fi
        cd build/android
        # The exec bit is lost when gradlew is extracted from the embedded
        # build assets, so restore it before invoking the wrapper. POSIX only:
        # Windows 没有 exec 位概念，且 gosh 的 chmod 是外部命令（依赖 Git Bash）。
        {{if ne OS "windows"}}chmod +x ./gradlew{{end}}
        {{.GRADLEW}} bundleRelease
        cp app/build/outputs/bundle/release/app-release.aab "../../{{.BIN_DIR}}/{{.APP_NAME}}.aab"
        echo "Release AAB created: {{.BIN_DIR}}/{{.APP_NAME}}.aab"

  generate:android:overlay:
    internal: true
    summary: Generate Go build overlay that registers the Android main
    sources:
      - build/config.yml
    generates:
      - build/android/.overlay/overlay.json
      - build/android/.overlay/gen/main_android.gen.go
    cmds:
      # 输出目录以 "." 开头是刻意的：Go 工具链会跳过点/下划线开头的目录。
      # 生成物是 `package main` 且引用 main()，若落在普通目录下，
      # `go build ./...` 会把它扫进来并报 undefined: main。
      - wails3 android overlay:gen -out build/android/.overlay/overlay.json -config build/config.yml

  generate:android:bindings:
    internal: true
    summary: Generates bindings for Android
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      # Bindings are generated from the Go AST; CGO is disabled so the NDK
      # is not required for this step
      - wails3 generate bindings -f '-tags android' -clean=true
    env:
      GOOS: android
      CGO_ENABLED: 0

  ensure-emulator:
    internal: true
    summary: Ensure Android Emulator is running
    silent: true
    cmds:
      - |
        # Check if an emulator is already running（case 替代 grep -q，grep 是
        # Git Bash 外部命令）
        case "$("{{.ADB}}" devices)" in
          *emulator*) echo "Emulator already running"; exit 0 ;;
        esac

        # Get last available AVD（heredoc + while read 取末行，替代 tail -1）
        AVD_NAME=""
        while IFS= read -r l; do AVD_NAME="$l"; done <<AVDS
        $("{{.EMULATOR}}" -list-avds)
        AVDS
        if [ -z "$AVD_NAME" ]; then
          # No AVD yet. Mirror the iOS `ensure-simulator` flow and create one
          # automatically — but ONLY from a system image that is already
          # installed. We never trigger an sdkmanager download from a `run`
          # task (that would be a surprise multi-GB download + license prompt).
          # Pick the highest-API installed image matching the host ABI.
          # glob 循环取最后一个（字典序 = 版本序），替代 ls|sort -V|tail。
          SDK_ROOT="{{.SDK_ROOT}}"
          ABI="{{.ANDROID_ABI}}"
          IMG=""
          for d in "$SDK_ROOT"/system-images/android-*/*/"$ABI"; do
            [ -d "$d" ] && IMG="$d"
          done
          AVDMANAGER="{{.AVDMANAGER}}"
          if [ -n "$IMG" ] && [ -x "$AVDMANAGER" ]; then
            # 纯参数展开做路径分段，替代 sed|tr：IMG = <SDK>/system-images/
            # android-<API>/<variant>/<ABI> → system-images;android-N;variant;ABI
            REL=${IMG#"$SDK_ROOT"/system-images/}
            PKG="system-images;${REL%%/*};$(R=${REL#*/}; echo "${R%%/*};${R#*/}")"
            echo "No Android Virtual Devices found. Creating 'wails' from $PKG..."
            echo "no" | "$AVDMANAGER" create avd --name wails --package "$PKG" --device pixel_7 --force
            AVD_NAME=wails
          else
            echo "No Android Virtual Devices found, and no system image is installed to create one from."
            echo "Install a system image and create an AVD, e.g.:"
            echo "  sdkmanager 'system-images;android-35;google_apis;$ABI'"
            echo "  avdmanager create avd --name wails --package 'system-images;android-35;google_apis;$ABI' --device pixel_7"
            exit 1
          fi
        fi

        echo "Starting emulator: $AVD_NAME"
        # Start the emulator daemonized so it outlives this task step. go-task's
        # shell tracks background jobs by PID and reaps them when the command's
        # interpreter finishes (which nohup/setsid alone don't prevent — the kill
        # is direct), so a bare `emulator &` is gone before the later
        # install/launch steps run. Windows 用 pwsh Start-Process 直接脱管
        # （nohup/sh 都是 Git Bash 外部命令）；POSIX 保留 nohup 子壳方案。
        {{if eq OS "windows"}}
        pwsh -NoProfile -Command "Start-Process -FilePath '{{.EMULATOR}}' -ArgumentList '-avd','$AVD_NAME','-no-snapshot-load' -WindowStyle Hidden"
        {{else}}
        nohup sh -c "'{{.EMULATOR}}' -avd '$AVD_NAME' -no-snapshot-load </dev/null >/dev/null 2>&1 &" >/dev/null 2>&1
        {{end}}

        # Wait for emulator to boot (max 120 seconds). 轮询循环放到设备端执行
        # （toybox 自带 sleep/getprop），宿主侧没有 sleep/seq 可用。
        echo "Waiting for emulator to boot..."
        "{{.ADB}}" wait-for-device
        "{{.ADB}}" shell 'i=0; while [ "$i" -lt 120 ]; do [ "$(getprop sys.boot_completed)" = "1" ] && exit 0; i=$((i+1)); sleep 1; done; exit 1' \
          || { echo "Emulator boot timeout"; exit 1; }
        echo "Emulator booted successfully"
    preconditions:
      - sh: '[ -x "{{.ADB}}" ] || command -v adb'
        msg: "adb not found. Install the Android SDK platform-tools (or set ANDROID_HOME)"
      - sh: '[ -x "{{.EMULATOR}}" ] || command -v emulator'
        msg: "emulator not found. Install the Android SDK emulator package (or set ANDROID_HOME)"

  deploy-emulator:
    summary: Deploy the packaged release APK to the Android Emulator
    deps:
      - task: package
        vars:
          ARCH: '{{.ARCH | default .HOST_ARCH}}'
    cmds:
      - task: ensure-emulator
      - '"{{.ADB}}" uninstall {{.APP_ID}} 2>/dev/null || true'
      - '"{{.ADB}}" install "{{.BIN_DIR}}/{{.APP_NAME}}.apk"'
      - '"{{.ADB}}" shell am start -n {{.APP_ID}}/com.wails.app.MainActivity'

  run:
    summary: Build, install and launch a debug build in the Android Emulator
    deps:
      - task: ensure-emulator
      - task: build
    cmds:
      - task: assemble:apk
      - '"{{.ADB}}" uninstall {{.APP_ID}} 2>/dev/null || true'
      - '"{{.ADB}}" install "{{.BIN_DIR}}/{{.APP_NAME}}.apk"'
      - '"{{.ADB}}" shell am start -n {{.APP_ID}}/com.wails.app.MainActivity'

  device:list:
    summary: Lists connected Android devices and emulators (serials)
    cmds:
      - '"{{.ADB}}" devices -l'

  run:device:
    summary: Build, install and launch a debug build on a connected physical Android device
    deps:
      - task: build
        vars:
          ARCH: arm64
    cmds:
      - task: assemble:apk
      - |
        DEVICE='{{.DEVICE_ID | default ""}}'
        if [ -z "$DEVICE" ]; then
          DEVICE="${DEVICE_ID:-}"
        fi
        if [ -z "$DEVICE" ]; then
          DEVICE=$("{{.ADB}}" devices | while read -r serial state _; do serial=${serial%$'\r'}; case "$serial" in ''|List*|emulator-*) continue ;; esac; [ "${state%$'\r'}" = "device" ] && { echo "$serial"; break; }; done)
        fi
        if [ -z "$DEVICE" ]; then
          echo "Error: no connected physical Android device found."
          echo "Pass DEVICE_ID=<serial> to target a device explicitly."
          echo "Find connected device serials with: {{.ADB}} devices"
          exit 1
        fi

        echo "Deploying {{.BIN_DIR}}/{{.APP_NAME}}.apk to device $DEVICE..."
        "{{.ADB}}" -s "$DEVICE" uninstall {{.APP_ID}} 2>/dev/null || true
        "{{.ADB}}" -s "$DEVICE" install "{{.BIN_DIR}}/{{.APP_NAME}}.apk"
        "{{.ADB}}" -s "$DEVICE" shell am start -n {{.APP_ID}}/com.wails.app.MainActivity
    preconditions:
      - sh: '[ -x "{{.ADB}}" ] || command -v adb'
        msg: "adb not found. Install the Android SDK platform-tools (or set ANDROID_HOME)"

  deploy-device:
    summary: Deploy the packaged release APK to a connected physical Android device
    deps:
      - task: package
        vars:
          ARCH: arm64
    cmds:
      - |
        DEVICE='{{.DEVICE_ID | default ""}}'
        if [ -z "$DEVICE" ]; then
          DEVICE="${DEVICE_ID:-}"
        fi
        if [ -z "$DEVICE" ]; then
          DEVICE=$("{{.ADB}}" devices | while read -r serial state _; do serial=${serial%$'\r'}; case "$serial" in ''|List*|emulator-*) continue ;; esac; [ "${state%$'\r'}" = "device" ] && { echo "$serial"; break; }; done)
        fi
        if [ -z "$DEVICE" ]; then
          echo "Error: no connected physical Android device found."
          echo "Pass DEVICE_ID=<serial> to target a device explicitly."
          echo "Find connected device serials with: {{.ADB}} devices"
          exit 1
        fi

        echo "Deploying {{.BIN_DIR}}/{{.APP_NAME}}.apk to device $DEVICE..."
        "{{.ADB}}" -s "$DEVICE" uninstall {{.APP_ID}} 2>/dev/null || true
        "{{.ADB}}" -s "$DEVICE" install "{{.BIN_DIR}}/{{.APP_NAME}}.apk"
        "{{.ADB}}" -s "$DEVICE" shell am start -n {{.APP_ID}}/com.wails.app.MainActivity
    preconditions:
      - sh: '[ -x "{{.ADB}}" ] || command -v adb'
        msg: "adb not found. Install the Android SDK platform-tools (or set ANDROID_HOME)"

  update:device:
    summary: Build and reinstall on a device, keeping app data (adb install -r)
    desc: |
      与 run:device 只差一条：这里用 `adb install -r -d` 覆盖安装，应用数据目录
      （书架、书源、缓存、登录态）保留；run:device 先 uninstall，装成全新状态。

      迭代测试用这个，省得每次重建都重新导书。要干净重装仍用 run:device。

      DEVICE_ID=<serial> 指定设备；不传则取第一台非模拟器的在线设备。
    deps:
      - task: build
        vars:
          ARCH: arm64
    cmds:
      - task: assemble:apk
      - |
        DEVICE="${DEVICE_ID:-}"
        if [ -z "$DEVICE" ]; then
          DEVICE=$("{{.ADB}}" devices | while read -r serial state _; do serial=${serial%$'\r'}; case "$serial" in ''|List*|emulator-*) continue ;; esac; [ "${state%$'\r'}" = "device" ] && { echo "$serial"; break; }; done)
        fi
        if [ -z "$DEVICE" ]; then
          echo "Error: no connected physical Android device found."
          echo "Pass DEVICE_ID=<serial> to target a device explicitly."
          exit 1
        fi
        # 工作目录是 desktop/（included taskfile 的 cmds 不从 build/android 起跑），
        # 所以这里不能再加 ../../ —— 那是 assemble:apk 里 cd build/android 之后的写法。
        APK="{{.BIN_DIR}}/{{.APP_NAME}}.apk"
        if [ ! -f "$APK" ]; then
          echo "Error: $APK not found. Run: task android:assemble:apk"
          exit 1
        fi
        echo "Reinstalling $APK on $DEVICE (app data kept)..."
        "{{.ADB}}" -s "$DEVICE" install -r -d "$APK"

  uninstall:device:
    summary: Uninstall the app from a device (this deletes its data)
    desc: |
      卸载会连同 /data/data/<APP_ID> 一起删掉：书架、书源、缓存、书源登录态全没。
      只想换包不丢数据的话用 update:device。
    cmds:
      - |
        DEVICE="${DEVICE_ID:-}"
        if [ -z "$DEVICE" ]; then
          DEVICE=$("{{.ADB}}" devices | while read -r serial state _; do serial=${serial%$'\r'}; case "$serial" in ''|List*|emulator-*) continue ;; esac; [ "${state%$'\r'}" = "device" ] && { echo "$serial"; break; }; done)
        fi
        if [ -z "$DEVICE" ]; then
          echo "Error: no connected physical Android device found."
          exit 1
        fi
        "{{.ADB}}" -s "$DEVICE" uninstall {{.APP_ID}}
        echo "Uninstalled {{.APP_ID}} from $DEVICE (data removed)."

  vd:
    summary: Run the installed app on an scrcpy virtual display (nothing appears on the phone)
    desc: |
      用 scrcpy 的 --new-display 在手机上新建一块**虚拟显示**，把应用启动到那块屏上，
      画面只出现在电脑的 scrcpy 窗口里。手机主屏不受影响，用户还能继续用手机做别的
      （实测：虚拟显示跑着应用时，主屏仍在正常显示其它 app）。

      这是安卓端 UI 验收的主力手段 —— 不必碰手机、不必投屏整机、也不会打断在用的人。

      VARS:
        VD_SIZE   虚拟显示分辨率，默认 720x1280（竖屏手机比例）
        VD_DPI    密度，默认 320；420 更接近 1080p 手机的实际观感
        DEVICE_ID 指定设备；不传则取第一台非模拟器设备
        SCRCPY    scrcpy 可执行文件路径；默认取 PATH 里的

      要求 scrcpy >= 3.3.3：更早的版本在 Android 16+ 上创建虚拟显示会崩
      （服务端 AbstractMethodError: onDisplayAnimationsDisabledChanged，3.3.3 才修）。
    cmds:
      - |
        DEVICE="${DEVICE_ID:-}"
        if [ -z "$DEVICE" ]; then
          DEVICE=$("{{.ADB}}" devices | while read -r serial state _; do serial=${serial%$'\r'}; case "$serial" in ''|List*|emulator-*) continue ;; esac; [ "${state%$'\r'}" = "device" ] && { echo "$serial"; break; }; done)
        fi
        if [ -z "$DEVICE" ]; then
          echo "Error: no connected physical Android device found."
          echo "Connect by USB, or wirelessly: adb pair <ip:port> && adb connect <ip:port>"
          exit 1
        fi

        SCRCPY_BIN='{{.SCRCPY}}'
        if [ -z "$SCRCPY_BIN" ]; then
          SCRCPY_BIN=$(command -v scrcpy || true)
        fi
        if [ -z "$SCRCPY_BIN" ]; then
          echo "Error: scrcpy not found. Need >= 3.3.3 for virtual display on Android 16+."
          echo "  winget install --id Genymobile.scrcpy     # Windows"
          echo "  brew install scrcpy                       # macOS"
          exit 1
        fi

        # 版本解析用参数展开 + 算术比较（head|sed|awk 都是 Git Bash 外部命令）
        VER=$("$SCRCPY_BIN" --version 2>/dev/null | while IFS=' ' read -r _ v _; do echo "${v%$'\r'}"; break; done)
        MAJOR=${VER%%.*}; REST=${VER#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}; PATCH=${PATCH%%[!0-9]*}
        NUM=""
        case "${MAJOR}${MINOR}${PATCH}" in
          *[!0-9]*|"") NUM="" ;;
          *) NUM=$((MAJOR*1000000 + MINOR*1000 + PATCH)) ;;
        esac
        if [ -n "$NUM" ] && [ "$NUM" -lt 3003003 ]; then
          echo "Error: scrcpy $VER is too old. Virtual display crashes on Android 16+"
          echo "  (AbstractMethodError: onDisplayAnimationsDisabledChanged; fixed in 3.3.3)."
          echo "  Upgrade: winget upgrade --id Genymobile.scrcpy"
          exit 1
        fi

        SIZE='{{.VD_SIZE | default "720x1280"}}'
        DPI='{{.VD_DPI | default "320"}}'
        echo "scrcpy $VER -> virtual display ${SIZE}/${DPI} on $DEVICE (phone screen stays untouched)"
        "$SCRCPY_BIN" -s "$DEVICE" \
          --new-display="${SIZE}/${DPI}" \
          --start-app={{.APP_ID}} \
          --no-audio \
          --no-vd-system-decorations \
          --window-title="{{.APP_NAME}} ${SIZE} (virtual display)"

  vd:shot:
    summary: Capture one still frame from the virtual display, headless
    desc: |
      无窗口跑一次虚拟显示（默认 12 秒），把画面录下来再挑一帧，产物
      bin/vd-shot.png。用于自动化验收「页面到底渲染出来没有」，不需要人看窗口。

      为什么必须录而不是截图：虚拟显示是 scrcpy 建的，进程退出即销毁，adb screencap
      抓的是主屏（display 0），拿不到这块屏。

      两个实测过的坑：
      1. scrcpy 只编码**变化**的帧，静止界面时视频很短 —— 按 -ss 5 取帧会越界报
         "Output file is empty"，所以要用 -sseof（从末尾回退）。
      2. 末尾的帧不可靠：录制收尾时可能取到黑帧（应用还没画完，或显示正在销毁）。
         所以从最后 3 秒里取 4 个候选帧，选**文件体积最大**的那张 —— 纯黑 PNG 只有
         十几 KB，正常界面在几十到上百 KB，这个判据比固定时间点稳。

      依赖 pwsh 7 与 ffmpeg（能出 png 的任意版本；不需要 ffprobe）；实现脚本
      build/android/scripts/vd-shot.ps1。VARS 同 vd，另有 SEC（默认 12）。

      渲染时长依分辨率/密度而变（实测 1080x1920/240 要 10 秒以上才出画面，8 秒抓到的是
      纯黑），因此取不到内容时会自动把录制时长翻倍重试一次，避免把黑图当成「页面没渲染」。
    cmds:
      - |
        DEVICE="${DEVICE_ID:-}"
        if [ -z "$DEVICE" ]; then
          DEVICE=$("{{.ADB}}" devices | while read -r serial state _; do serial=${serial%$'\r'}; case "$serial" in ''|List*|emulator-*) continue ;; esac; [ "${state%$'\r'}" = "device" ] && { echo "$serial"; break; }; done)
        fi
        if [ -z "$DEVICE" ]; then echo "Error: no connected physical Android device found."; exit 1; fi
        # 录制/取帧/挑帧逻辑在 pwsh 脚本里实现：wc/ls -S/tr 等 Unix 工具
        # gosh 没有（只有 Git Bash 环境才提供），pwsh 与 scrcpy/ffmpeg 一样
        # 是显式声明的跨平台工具，不依赖执行环境。
        pwsh -NoProfile -File "{{.ROOT_DIR}}/build/android/scripts/vd-shot.ps1" \
          -DeviceId "$DEVICE" -AppId "{{.APP_ID}}" -OutDir "{{.BIN_DIR}}" \
          -Scrcpy '{{.SCRCPY}}' \
          -Size '{{.VD_SIZE | default "720x1280"}}' -Dpi '{{.VD_DPI | default "320"}}' -Sec '{{.SEC | default "12"}}'

  studio:
    summary: Open the generated Android project in Android Studio
    cmds:
      - |
        if command -v studio >/dev/null 2>&1; then
          studio build/android
        elif [ -d "/Applications/Android Studio.app" ]; then
          open -a "Android Studio" build/android
        else
          echo "Android Studio not found. Install it from https://developer.android.com/studio,"
          echo "then open the build/android directory."
          exit 1
        fi

  logs:
    summary: Stream Android logcat filtered to this app
    cmds:
      # 纯 sh 流过滤（grep 是 Git Bash 外部命令）
      - |
        ( "{{.ADB}}" logcat -v time | while IFS= read -r line; do
            case "$line" in *Wails*|*{{.APP_NAME}}*) echo "$line" ;; esac
          done ) || true

  logs:all:
    summary: Stream all Android logcat (verbose)
    cmds:
      - '"{{.ADB}}" logcat -v time'

  clean:
    summary: Clean build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf build/android/app/build
      - rm -rf build/android/app/src/main/jniLibs/*/libwails.so
      - rm -rf build/android/.gradle
