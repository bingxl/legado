plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wails.app'
    compileSdk 35
    // AGP 8.7.3 默认要 build-tools 34.0.0；本机没装且联网拉 SDK 仓库会超时，
    // 显式指向已安装的版本，构建就不必再去查远程 manifest。
    buildToolsVersion '35.0.0'

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        // 自有包名，避免与官方 legado（io.legado.app）互相覆盖安装。
        // 注意 Java 源码仍在 com.wails.app 包下，applicationId 与之不同是
        // Android 允许的；Taskfile 里 `am start` 用的也是
        // {{.APP_ID}}/com.wails.app.MainActivity 这种写法。
        //
        // 改这里必须同步 desktop/Taskfile.yml 的 android.vars.APP_ID，
        // 否则 adb uninstall / am start 会指向另一个包。
        applicationId "cn.bingxl.legado"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
