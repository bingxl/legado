# This file is generated by the Gradle `updateDaemonJvm` task (written by hand, see below).
#
# 固定 Gradle daemon 使用的 JVM，避免 JAVA_HOME 指向 JDK 21 时构建悄悄换版本。
# 本机 JDK 25：C:\Program Files\Java\jdk-25.0.5.1
# 只约束"大版本 + vendor 不限"，换机器时只要装了任一 JDK 25 即可。
#
# 手工维护的原因：`updateDaemonJvm` 要求先在 settings.gradle 配置 toolchain 下载仓库
# （foojay-resolver-convention）。本项目只要用本机已装的 JDK，不需要自动下载。
# 如果以后确实要自动下载，再补插件并重新执行：
#   gradle updateDaemonJvm --jvm-version=25
toolchainVersion=25
