version: '3'

# Flutter 版构建入口。
# 另外，旧 Go/Wails 栈的 Taskfile 已随迁移删除，这里是当前 flutter 栈的重建版本。
# 默认只打 arm64-v8a（俗称 armv8，约 31 MB），避免 universal APK 把三套 ABI 全塞进去（约 81 MB）。
# 用法：
#   task                 # 等价于 task apk:armv8
#   task apk:armv7       # 仅 armeabi-v7a
#   task apk:x64         # 仅 x86_64
#   task apk:all         # 三套 ABI 各自出包
#   task apk:install     # 构建 arm64-v8a 并 adb 安装

vars:
  APP_DIR: legado-flutter/app
  APK_DIR: build/app/outputs/flutter-apk
  APK_ARM64: app-arm64-v8a-release.apk
  APK_ARMV7: app-armeabi-v7a-release.apk
  APK_X64: app-x86_64-release.apk

tasks:
  default:
    desc: 默认构建 arm64-v8a release APK
    cmds:
      - task: apk:armv8

  apk:
    desc: 同 apk:armv8，默认只打 arm64-v8a
    cmds:
      - task: apk:armv8

  apk:armv8:
    desc: 构建 arm64-v8a release APK（约 31 MB）
    aliases: [armv8, arm64]
    dir: '{{.APP_DIR}}'
    cmds:
      - flutter build apk --release --split-per-abi --target-platform android-arm64

  apk:armv7:
    desc: 构建 armeabi-v7a release APK
    aliases: [armv7, arm]
    dir: '{{.APP_DIR}}'
    cmds:
      - flutter build apk --release --split-per-abi --target-platform android-arm

  apk:x64:
    desc: 构建 x86_64 release APK（模拟器/少数 x86 设备）
    aliases: [x64, x86_64]
    dir: '{{.APP_DIR}}'
    cmds:
      - flutter build apk --release --split-per-abi --target-platform android-x64

  apk:all:
    desc: 三套 ABI 分别出包
    aliases: [split]
    dir: '{{.APP_DIR}}'
    cmds:
      - flutter build apk --release --split-per-abi

  apk:universal:
    desc: 旧式 universal 包（三套 ABI 打在一个 APK 里，约 81 MB）
    dir: '{{.APP_DIR}}'
    cmds:
      - flutter build apk --release

  apk:debug:armv8:
    desc: 构建 arm64-v8a debug APK
    aliases: [debug]
    dir: '{{.APP_DIR}}'
    cmds:
      - flutter build apk --debug --split-per-abi --target-platform android-arm64

  apk:install:
    desc: 构建 arm64-v8a 并通过 adb 安装到已连接设备
    aliases: [install]
    cmds:
      - task: apk:armv8
      - 'adb install -r "{{.APP_DIR}}/{{.APK_DIR}}/{{.APK_ARM64}}"'
