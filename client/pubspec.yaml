name: legado
description: "Legado 跨端阅读器（Flutter + Go core）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  # 传输层：只用于与本地 core 的 /rpc、/content 通信，不是业务 HTTP 客户端。
  http: ^1.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
