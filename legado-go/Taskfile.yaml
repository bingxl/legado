# legado-go 构建任务
# 用法：在 legado-go 目录下执行 task <任务名>，如 task build:windows
# 需要 Task: https://taskfile.dev  （winget install Task.Task / brew install go-task）
version: '3'

silent: false

vars:
  APP: legado
  PKG: ./cmd/legado
  DIST: dist
  # 版本信息：优先用 git tag，其次提交号，-dirty 表示有未提交改动
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: 列出全部任务
    cmds:
      - task --list-all
    silent: true

  # 内部任务：由下面各平台任务调用，不直接执行
  _build:
    internal: true
    desc: 通用编译（由各平台任务传入 GOOS / GOARCH）
    vars:
      EXE: '{{if eq .GOOS "windows"}}.exe{{end}}'
      OUT: '{{.DIST}}/{{.APP}}-{{.GOOS}}-{{.GOARCH}}{{.EXE}}'
    env:
      CGO_ENABLED: '0' # 纯 Go 依赖（goja/goquery 等），关掉 CGO 才能静态交叉编译
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
    cmds:
      - mkdir -p {{.DIST}}
      - go build -trimpath -ldflags "-s -w" -o {{.OUT}} {{.PKG}}
      - echo "已生成 {{.OUT}}（{{.GOOS}}/{{.GOARCH}}，版本 {{.VERSION}}）"

  build:
    desc: 按当前平台编译到 dist/
    cmds:
      - task: _build
        vars:
          GOOS: '{{OS}}'
          GOARCH: '{{ARCH}}'

  build:windows:
    desc: Windows amd64（dist/legado-windows-amd64.exe）
    cmds:
      - task: _build
        vars:
          GOOS: windows
          GOARCH: amd64

  build:linux:
    desc: Linux amd64（dist/legado-linux-amd64）
    cmds:
      - task: _build
        vars:
          GOOS: linux
          GOARCH: amd64

  build:armv8:
    desc: Linux arm64（aarch64，给 Termux / 树莓派用，dist/legado-linux-arm64）
    cmds:
      - task: _build
        vars:
          GOOS: linux
          GOARCH: arm64

  build:all:
    desc: 一次编译全部平台（windows / linux / armv8）
    cmds:
      - task: build:windows
      - task: build:linux
      - task: build:armv8

  clean:
    desc: 清理 dist/
    cmds:
      - rm -rf {{.DIST}}
      - echo "已清理 {{.DIST}}"

  # 提交前质量门（AGENTS.md 第 7 节）。任一命令非零退出即中止。
  # 注意：gofmt -l . 只列出未格式化文件，不返回失败，需人工确认为空。
  # go fix 用 -json 判据：-diff 在"多分析器抢同一 import 块"时会静默跳过，看不出漏改。
  check:
    desc: 质量门：构建 / vet / 测试 / 现代化自检
    cmds:
      - gofmt -l .
      - go build ./...
      - go vet ./...
      - go test ./...
      - test -z "$(go fix -json ./... | grep -v '^{}$')"
      - echo "质量门通过（上面 gofmt 若无文件名输出、go fix 若无诊断即合格）"

  check:race:
    desc: 并发改动专用：带竞态检测跑全部测试
    cmds:
      - go test -race ./...
      - echo "race 检测通过"
